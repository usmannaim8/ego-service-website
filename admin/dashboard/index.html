<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration Dashboard | EGO SERVICE</title>
    <meta name="description" content="Administration dashboard concept for EGO SERVICE." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/main.css" />

  <body class="portal-page admin-page">
    <header class="portal-header admin-header">
      <div class="container portal-nav">
        <div class="portal-brand-inline">
          <span class="brand-mark">E</span>
          <span>ADMINISTRATION</span>
        </div>
        <nav class="portal-menu">
          <a href="index.html" class="active">Overview</a>
          <a href="../employees/index.html">Employees</a>

          <a href="../workflows/index.html">Workflows</a>

        </nav>
        <div class="user-chip">MA</div>
      </div>
    </header>

    <main class="container portal-content">
      <section class="welcome-panel">
        <div>
          <p class="eyebrow">Master Administrator</p>
          <h1>Administration overview</h1>
        </div>
        <button class="btn btn-primary">Create employee</button>
      </section>

      <section class="dashboard-grid">
        <article class="dashboard-card">
          <span class="card-label">Total Employees</span>
          <h3>142</h3>
        </article>
        <article class="dashboard-card">
          <span class="card-label">Subsidiaries</span>
          <h3>06</h3>
        </article>
        <article class="dashboard-card">
          <span class="card-label">Pending Approvals</span>
          <h3>08</h3>
        </article>
        <article class="dashboard-card">
          <span class="card-label">Open Signatures</span>
          <h3>12</h3>
        </article>
      </section>
    </main>

    <script src="../../assets/js/main.js"></script>
